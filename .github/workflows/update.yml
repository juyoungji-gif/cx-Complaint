name: Update Slack Complaint Data

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 실행 (UTC 기준)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 슬랙 데이터 가져오기
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node scripts/fetch-slack.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/complaints.json
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 민원 데이터 자동 업데이트"
          git push
